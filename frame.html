<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Xpu Command frame</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .frame { position: fixed; inset: 0; border: 3px solid #7c5cff; border-radius: 12px; box-shadow: 0 0 0 1px rgba(255,255,255,.35) inset, 0 0 18px rgba(124,92,255,.55); animation: glow 1.6s ease-in-out infinite; }
    @keyframes glow { 50% { border-color: #408cff; box-shadow: 0 0 0 1px rgba(255,255,255,.35) inset, 0 0 26px rgba(64,140,255,.6); } }
  </style>
</head>
<body><div class="frame"></div></body>
</html>
